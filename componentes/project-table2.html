<div class="row g-3 mb-3">
  <div class="col-12 col-md-4 offset-md-8">
    <input type="text" class="csearch form-control" data-table="ctable" placeholder="Buscador" alt="buscador" />
  </div>
</div>

<div class="table-responsive">
  <table class="ctable table text-small">
    <thead>
      <tr>
        <th>ID</th>
        <th>Proyecto</th>
        <th>Responsable</th>
        <th>Estado</th>
        <th>Presupuesto Total</th>
        <th>Editar</th>
      </tr>
    </thead>
    <tbody id="projectsBody">
      <!-- filas normales: se llenan con JS -->
    </tbody>

    <!-- Plantilla de fila de edición: ya definida en el HTML.
       El JS solo la clona y llena los valores, no construye el markup. -->
    <template id="edit-row-template">
      <tr>
        <td class="cell-id"></td>
        <td>
          <input type="text" class="form-control form-control-sm" id="edit-proyecto" alt="editor-texto" />
        </td>
        <td>
          <select class="form-select form-select-sm" id="edit-responsable">
            <option value="José">José</option>
            <option value="Coni">Coni</option>
          </select>
        </td>
        <td>
          <select class="form-select form-select-sm" id="edit-estado">
            <option value="Pendiente">Pendiente</option>
            <option value="En desarrollo">En desarrollo</option>
            <option value="Finalizado">Finalizado</option>
          </select>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" id="edit-presupuesto" alt="button-edit" />
        </td>
        <td>
          <button class="btn btn-success btn-sm" id="btn-save">Guardar</button>
          <button class="btn btn-secondary btn-sm" id="btn-cancel">Cancelar</button>
        </td>
      </tr>
    </template>
  </table>
</div>

<div class="pagination-footer">
  <span id="pageInfo" class="page-info"></span>
  <nav>
    <ul class="pagination pagination-sm mb-0 flex-wrap justify-content-center" id="pagination">
      <li class="page-item" id="pag-first">
        <a class="page-link" href="#" aria-label="Primero">&laquo;</a>
      </li>
      <li class="page-item" id="pag-prev">
        <a class="page-link" href="#" aria-label="Anterior">&lsaquo;</a>
      </li>
      <!-- los números de página se insertan aquí -->
      <li class="page-item" id="pag-next">
        <a class="page-link" href="#" aria-label="Siguiente">&rsaquo;</a>
      </li>
      <li class="page-item" id="pag-last">
        <a class="page-link" href="#" aria-label="Último">&raquo;</a>
      </li>
    </ul>
  </nav>
</div>
