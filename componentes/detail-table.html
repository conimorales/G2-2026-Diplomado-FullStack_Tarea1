<div class="row g-3 mb-3">
    <div class="col-12 col-md-4 offset-md-8">
        <input type="text" class="csearch form-control" data-table="ctable" placeholder="Buscador" alt="buscador" />
    </div>
</div>

<!-- Estado de carga -->
<div id="loadingState" class="text-center py-4">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2 mb-0">Cargando solicitudes...</p>
</div>

<!-- Estado de error -->
<div id="errorState" class="alert alert-danger d-none" role="alert">
    Ocurrió un error al cargar las solicitudes. Intenta nuevamente más tarde.
</div>

<div class="table-responsive d-none" id="tableWrapper">

    <table id="tablaDetalleSolicitudes" class="table table-striped ctable table text-small">
        <thead>
            <tr>
                <th>ID</th>
                <th>Solicitud</th>
                <th>Descripción Solicitud</th>
                <th>Sistema</th>
                <th>CER</th>
                <th>Estado</th>
                <th>Impacto Financiero</th>
                <th>Fecha Creación</th>
            </tr>
        </thead>
        <tbody id="projectsBody2">
            <!-- filas normales: se llenan con JS -->
        </tbody>
    </table>


</div>

<div class="pagination-footer d-none" id="paginationFooter">
    <span id="pageInfo" class="page-info"></span>
    <nav>
        <ul class="pagination pagination-sm mb-0 flex-wrap justify-content-center" id="pagination">
            <li class="page-item" id="pag-first">
                <a class="page-link" href="#" aria-label="Primero">&laquo;</a>
            </li>
            <li class="page-item" id="pag-prev">
                <a class="page-link" href="#" aria-label="Anterior">&lsaquo;</a>
            </li>
            <!-- los números de página se insertan aquí -->
            <li class="page-item" id="pag-next">
                <a class="page-link" href="#" aria-label="Siguiente">&rsaquo;</a>
            </li>
            <li class="page-item" id="pag-last">
                <a class="page-link" href="#" aria-label="Último">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
