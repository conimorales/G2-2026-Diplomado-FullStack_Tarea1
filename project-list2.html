<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma de gestión de proyectos TI</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <!-- LIBRERÍA DATATABLES -->
    <link href="https://cdn.datatables.net/v/dt/dt-3.0.1/datatables.min.css" rel="stylesheet" />
    <!-- FORMATO LETRAS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <!-- FONTAWESOME ICONOS -->
    <script src="https://kit.fontawesome.com/49ce9d820e.js" crossorigin="anonymous"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/project-list2.css" />
  </head>

  <body>
    <header id="navbar"></header>
    <main>
        <section>

            <div class="container">
                <h5 class="text-center">Listado de proyectos</h5>

                <input type="text" class="csearch form-control mb-3" data-table="ctable" placeholder="Buscador">

                <table class="ctable table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Proyecto</th>
                            <th>Responsable</th>
                            <th>Estado</th>
                            <th>Presupuesto Total</th>
                        </tr>
                    </thead>
                    <tbody id="projectsBody">
                        <!-- se llena con JS -->
                    </tbody>
                </table>

                <div class="container text-center">

                    <div class="row justify-content-end">

                        <div class="col-4">
                            One of two columnsaaa
                        </div>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem;">
                    <span id="pageInfo" style="color:#6c757d; font-size:14px;"></span>
                    <nav id="pagination"></nav>
                </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="container" id="footer"></footer>

    <script src="https://cdn.datatables.net/v/dt/dt-3.0.1/datatables.min.js"></script>

    <script src="javascript/navbar.js"></script>

    <script src="javascript/project-list2.js"></script>
    <script src="javascript/footer.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
